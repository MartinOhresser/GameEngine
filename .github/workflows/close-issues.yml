name: Close issues

# GitHub closes "Closes #12" only when a pull request reaches the default
# branch (main). Features reach dev first, so this closes them on merge into dev.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    name: Close the issues a merged pull request resolves
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Close issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          text="${PR_TITLE}"$'\n'"${PR_BODY}"
          numbers=$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "$text" | grep -oE '[0-9]+' | sort -un || true)
          while read -r number; do
            [[ -n "$number" ]] || continue
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Fixed by #${PR_NUMBER}, merged into dev." || true
          done <<< "$numbers"
