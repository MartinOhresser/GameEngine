name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Minimum line coverage of the engine code (include/ and src/), in percent.
  COVERAGE_MIN: "90"

jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  format:
    name: Format (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs --no-run-if-empty clang-format-18 --dry-run --Werror

  modules:
    name: Modules (schema, includes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Check module.json files, includes and platform code
        run: python3 scripts/check_modules.py --require-schema
      - name: Check the skills against gectl and the repository
        run: python3 scripts/check_skills.py

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC 13 Debug", os: ubuntu-24.04, cxx: g++-13, preset: dev }
          - { name: "Linux GCC 13 Release", os: ubuntu-24.04, cxx: g++-13, preset: release }
          - { name: "Linux Clang 18 Debug", os: ubuntu-24.04, cxx: clang++-18, preset: dev }
          - { name: "macOS AppleClang Debug", os: macos-latest, cxx: clang++, preset: dev }
          - { name: "Windows MSVC Release", os: windows-latest, cxx: cl, preset: release }
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset asan -DCMAKE_CXX_COMPILER=g++-13
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  clang-tidy:
    name: clang-tidy 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18
      - name: Configure
        run: cmake --preset tidy -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
      - name: Build with clang-tidy
        run: cmake --build --preset tidy

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install gcovr
        run: pip install "gcovr>=8"
      - name: Configure
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++-13
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Report
        run: |
          gcovr --root . --gcov-executable gcov-13 \
            --filter '^include/ge/' --filter '^src/' \
            --filter '^tools/' --filter '^modules/' \
            --exclude '.*/gen/.*' --exclude 'tools/gectl/main.cpp' \
            --merge-lines --txt-metric line --print-summary \
            --txt \
            --xml coverage.xml \
            --fail-under-line "$COVERAGE_MIN"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  # The core must build for every platform the engine targets. Tests run on the
  # web build; Android and iOS are compiled only, since CI cannot launch them.
  wasm:
    name: WebAssembly (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: "3.1.74"
      - name: Configure
        run: emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/wasm
      - name: Test
        run: ctest --test-dir build/wasm --output-on-failure --no-tests=error

  android:
    name: Android (NDK, arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/android

  ios:
    name: iOS (simulator, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build/ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON \
            -DGE_BUILD_TESTS=OFF -DGE_BUILD_EXAMPLES=OFF
      - name: Build libraries
        run: cmake --build build/ios

  # Single required check for branch protection: it fails unless every job above
  # succeeded (failed, cancelled and skipped jobs all count as failures).
  ci-success:
    name: CI success
    if: always()
    needs:
      - workflow-lint
      - format
      - modules
      - build-test
      - sanitizers
      - clang-tidy
      - coverage
      - wasm
      - android
      - ios
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required job finished with result '$result'"
              exit 1
            fi
          done
