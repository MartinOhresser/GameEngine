name: CI

on:
  push:
    branches: [dev]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Minimum line coverage of the engine code (include/ and src/), in percent.
  COVERAGE_MIN: "90"

# AddressSanitizer, clang-tidy and the GCC Debug build are not repeated here:
# ./scripts/check.sh runs them locally before every pull request. This workflow
# keeps what only another machine can check (other compilers and systems,
# coverage) and the fast checks that guard contributions from outside.
jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  format:
    name: Format (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs --no-run-if-empty clang-format-18 --dry-run --Werror

  modules:
    name: Modules (schema, includes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Check module.json files, includes and platform code
        run: python3 scripts/check_modules.py --require-schema
      - name: Check the skills against gectl and the repository
        run: python3 scripts/check_skills.py

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC 13 Release", os: ubuntu-24.04, cxx: g++-13, preset: release }
          - { name: "Linux Clang 18 Debug", os: ubuntu-24.04, cxx: clang++-18, preset: dev }
          - { name: "macOS AppleClang Debug", os: macos-latest, cxx: clang++, preset: dev }
          - { name: "Windows MSVC Release", os: windows-latest, cxx: cl, preset: release }
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  platform:
    name: Platform ${{ matrix.name }} (SDL3)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux", os: ubuntu-24.04, cxx: g++-13 }
          - { name: "macOS", os: macos-latest, cxx: clang++ }
          - { name: "Windows", os: windows-latest, cxx: cl }
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libasound2-dev libgl1-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (SDL3 is built from source)
        run: cmake --preset platform -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset platform
      - name: Test (SDL dummy video and audio drivers, no window needed)
        run: ctest --preset platform
      - name: Play a game headless and take a screenshot
        shell: bash
        run: |
          exe=build/platform/platform/sdl/geplay
          if [ ! -f "$exe" ]; then exe="$exe.exe"; fi
          "$exe" games/move_sprite/game.json --headless --frames 30 --screenshot screenshot.bmp
      - name: Keep the screenshot
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.name }}
          path: screenshot.bmp

  # `gectl export` makes the zip that players receive. This job makes it for real, unpacks it in a
  # folder with spaces and an accent, checks that nothing but system libraries is needed, and
  # plays it without a window.
  export:
    name: Export ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows", os: windows-latest, target: windows }
          - { name: "Linux", os: ubuntu-24.04, target: linux }
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libasound2-dev libgl1-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev
      # On Windows the way a person does it: scripts\export.cmd, from a plain prompt (no Visual
      # Studio developer environment, no Ninja).
      - name: Export Doodle Jump (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\export.cmd games\doodle_jump\game.json --out dist
      # The scripts that open the launcher, the way a person does it: they build it, then start it
      # without a window for a few frames.
      - name: Open the launcher with gameEngine.cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        timeout-minutes: 30
        run: gameEngine.cmd --headless --frames 3
      - name: Open the launcher with gameEngine.sh (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: ./gameEngine.sh --headless --frames 3
      - name: Export Doodle Jump (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset release
          cmake --build --preset release --target gectl
          ./build/release/tools/gectl export games/doodle_jump/game.json --target linux --out dist
      # The three games made to try the engine (ADR 0013) are exported the same way.
      - name: Export 2048, chess and the tower defense (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call scripts\export.cmd games\game_2048\game.json --out dist-games
          if errorlevel 1 exit /b 1
          call scripts\export.cmd games\chess\game.json --out dist-games
          if errorlevel 1 exit /b 1
          call scripts\export.cmd games\tower_defense\game.json --out dist-games
          if errorlevel 1 exit /b 1
      - name: Export 2048, chess and the tower defense (Linux)
        if: runner.os == 'Linux'
        run: |
          for game in game_2048 chess tower_defense; do
            ./build/release/tools/gectl export games/$game/game.json --target linux --out dist-games
          done
      - name: Check the packages of the three games
        shell: bash
        run: |
          set -e
          zips=(dist-games/*.zip)
          test "${#zips[@]}" -eq 3
          for zip in "${zips[@]}"; do
            echo "== $zip"
            cmake -E tar tf "$zip" > contents-one.txt
            grep -q "data/game.json" contents-one.txt
            if grep -q "scenarios" contents-one.txt; then echo "::error::scenarios are shipped in $zip"; exit 1; fi
          done
      - name: Check the package and unpack it in a folder with spaces and an accent
        shell: bash
        run: |
          set -e
          zip=$(ls dist/*.zip)
          cmake -E tar tf "$zip" | tee contents.txt
          grep -q "README.txt" contents.txt
          grep -q "LICENSES.txt" contents.txt
          grep -q "data/game.json" contents.txt
          if grep -q "scenarios" contents.txt; then echo "::error::scenarios are shipped"; exit 1; fi
          mkdir -p "unpacked/Mon dossier é"
          (cd "unpacked/Mon dossier é" && cmake -E tar xf "$GITHUB_WORKSPACE/$zip")
      - name: Set up MSVC tools (Windows, for dumpbin)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check what the program depends on (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          exe=$(find unpacked -maxdepth 3 -type f -name '*.exe' | head -n 1)
          echo "program: $exe"
          dumpbin -dependents "$exe" | tee dependents.txt
          if grep -qiE "vcruntime|msvcp|msvcr|ucrtbase|api-ms-win-crt|sdl3" dependents.txt; then
            echo "::error::the program needs a library that Windows does not have"
            exit 1
          fi
      - name: Play the package without a window
        shell: bash
        timeout-minutes: 5
        run: |
          set -eo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe=$(find unpacked -maxdepth 3 -type f -name '*.exe' | head -n 1)
          else
            exe=$(find unpacked -maxdepth 3 -type f -perm -u+x | head -n 1)
          fi
          echo "playing $exe"
          chmod +x "$exe"
          "$exe" --headless --software --frames 30 --screenshot screenshot.bmp 2>&1 | tee play.log
          test -s screenshot.bmp
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: export-${{ matrix.name }}
          path: dist/*.zip

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install gcovr
        run: pip install "gcovr>=8"
      - name: Configure
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++-13
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Report
        run: |
          gcovr --root . --gcov-executable gcov-13 \
            --filter '^include/ge/' --filter '^src/' \
            --filter '^tools/' --filter '^modules/' \
            --exclude '.*/gen/.*' --exclude 'tools/gectl/main.cpp' \
            --merge-lines --txt-metric line --print-summary \
            --txt \
            --xml coverage.xml \
            --fail-under-line "$COVERAGE_MIN"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  # The core must build for every platform the engine targets. Tests run on the
  # web build; Android and iOS are compiled only, since CI cannot launch them.
  wasm:
    name: WebAssembly (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: "3.1.74"
      - name: Configure
        run: emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/wasm
      - name: Test
        run: ctest --test-dir build/wasm --output-on-failure --no-tests=error

  android:
    name: Android (NDK, arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/android
      # The program of an exported game, as the Android export builds it (ADR 0012): the shared
      # library `main` of an APK, with SDL and the game's modules inside.
      - name: Build the player (libmain.so with SDL3)
        run: |
          cmake -S . -B build/android-player -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON -DGE_BUILD_PLATFORM=ON \
            -DGE_BUILD_TESTS=OFF -DGE_BUILD_TOOLS=OFF -DGE_BUILD_EXAMPLES=OFF \
            "-DGE_PLAYER_MODULES=transform2d;action_control;debug_draw"
          cmake --build build/android-player --target ge_player
          ls -l build/android-player/platform/sdl/libmain.so

  # The Android export for real (ADR 0012): `gectl export --target android` makes the APK of a
  # reference game with the NDK and Gradle, aapt2 reads its identity back, and an emulator
  # (Android 14, x86_64) installs it, plays it with taps and a held finger and presses Back.
  android-export:
    name: Android APK of ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: doodle_jump, window: "480 720", adapt: "0.4 0.8", tap: "W/2 H/2-40" }
          - { game: treasure_run, window: "800 600", tap: "" }
          # The three games made to try the engine (ADR 0013), played with touches: a piece chosen
          # then moved (chess), two swipes (2048), a tower built then the next wave called.
          - { game: chess, window: "480 720", adapt: "0.4 0.8",
              touches: "W/2+32*min(W/540,(H-292)/540):(96+H-196)/2+160*min(W/540,(H-292)/540);W/2+32*min(W/540,(H-292)/540):(96+H-196)/2+32*min(W/540,(H-292)/540)" }
          - { game: game_2048, window: "480 720", adapt: "0.4 0.8",
              swipes: "W/2+120:H/2:W/2-120:H/2;W/2:H/2+120:W/2:H/2-120;W/2-120:H/2:W/2+120:H/2" }
          - { game: tower_defense, window: "800 480", adapt: "1.25 2.4",
              touches: "W/2-168*min(W/688,(H-100)/448):(H-28)/2-96*min(W/688,(H-100)/448);W/2+230:H-32" }
    steps:
      - uses: actions/checkout@v7
      - name: Build gectl
        run: |
          cmake --preset release -DGE_BUILD_TESTS=OFF
          cmake --build --preset release --target gectl
      - name: Export the game for Android (x86_64 for the emulator, arm64-v8a for phones)
        run: |
          started=$(date +%s)
          ./build/release/tools/gectl export games/${{ matrix.game }}/game.json --target android \
            --abi x86_64,arm64-v8a --out dist
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
      - name: What is in the APK
        run: |
          apk="$(find dist -name '*.apk' | head -1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          {
            echo "### $(basename "$apk")"
            echo "- export: ${seconds} s, APK: $(stat -c %s "$apk") bytes"
            echo '```'
            "$aapt2" dump badging "$apk" | grep -E "^package|application-label:|sdkVersion|launchable-activity"
            unzip -l "$apk" | grep -E "\.so|assets/data/(game|files)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          "$aapt2" dump badging "$apk" | grep -q "native-code: 'arm64-v8a' 'x86_64'" ||
            "$aapt2" dump badging "$apk" | grep -q "native-code: 'x86_64' 'arm64-v8a'"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GAME_WINDOW: ${{ matrix.window }}
          GAME_ADAPT: ${{ matrix.adapt }}
          MENU_TAP: ${{ matrix.tap }}
          GAME_TOUCHES: ${{ matrix.touches }}
          GAME_SWIPES: ${{ matrix.swipes }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: platform/android/run_game_on_device.sh dist/*.apk game-output
      - name: Put the result in the summary
        if: always()
        run: |
          if [ -f game-output/summary.md ]; then
            { echo "### On the emulator"; cat game-output/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ matrix.game }}
          path: |
            game-output
            dist/*.apk

  ios:
    name: iOS (simulator, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build/ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON \
            -DGE_BUILD_TESTS=OFF -DGE_BUILD_EXAMPLES=OFF
      - name: Build libraries
        run: cmake --build build/ios

  # Single required check for branch protection: it fails unless every job above
  # succeeded (failed, cancelled and skipped jobs all count as failures).
  ci-success:
    name: CI success
    if: always()
    needs:
      - workflow-lint
      - format
      - modules
      - build-test
      - platform
      - export
      - coverage
      - wasm
      - android
      - android-export
      - ios
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required job finished with result '$result'"
              exit 1
            fi
          done
