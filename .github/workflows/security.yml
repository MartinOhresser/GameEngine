name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  pull_request:
    paths: ["include/**", "src/**", "CMakeLists.txt", "cmake/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (C/C++)
    # Code scanning is free on public repositories only; on a private one it
    # needs GitHub Advanced Security. The job starts running once the repo is
    # public (or once Advanced Security is enabled and this condition removed).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # needed by CodeQL on private repositories
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake --preset release -DCMAKE_CXX_COMPILER=g++-13
          cmake --build --preset release
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
