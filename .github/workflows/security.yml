name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  pull_request:
    paths: ["include/**", "src/**", "CMakeLists.txt", "cmake/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake --preset release -DCMAKE_CXX_COMPILER=g++-13
          cmake --build --preset release
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
