name: Android export

# A3 of the Android export (ADR 0012): `gectl export --target android` makes the APK of a game for
# real (NDK, Gradle), and an emulator plays it. It runs when the files of the export change, or on
# demand; A6 will move it into the main workflow.
on:
  pull_request:
    paths:
      - "tools/gectl/export*"
      - "platform/android/**"
      - "platform/sdl/**"
      - ".github/workflows/android-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK of doodle_jump
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build gectl
        run: |
          cmake --preset release -DGE_BUILD_TESTS=OFF
          cmake --build --preset release --target gectl
      - name: Export the game for Android
        run: |
          started=$(date +%s)
          ./build/release/tools/gectl export games/doodle_jump/game.json --target android \
            --abi x86_64,arm64-v8a --out dist --skip-tests
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
          ls -l dist
      - name: Size and content of the APK
        run: |
          apk="$(ls dist/*.apk)"
          {
            echo "### $(basename "$apk")"
            echo "- export: ${seconds} s, APK: $(stat -c %s "$apk") bytes"
            echo '```'
            unzip -l "$apk" | grep -E "\.so|assets/data/(game|files)|classes|Archive" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump badging "$apk" | grep -E "^package|application-label:|sdkVersion|launchable" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play it on an emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: platform/android/run_game_on_device.sh dist/*.apk game-output
      - name: Put the result in the summary
        if: always()
        run: |
          if [ -f game-output/summary.md ]; then
            { echo "### On the emulator"; cat game-output/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-export
          path: |
            game-output
            dist/*.apk
