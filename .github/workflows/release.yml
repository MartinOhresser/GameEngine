name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Started by "Promote dev to main": a tag pushed with the workflow token does
  # not start workflows by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER=g++-13
      - name: Tag matches the CMake project version
        run: |
          version=$(cmake -LA -N build/release | sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p')
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  github-release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

  # The reference games as zips that run on their own: made on Windows with scripts\export.cmd,
  # the way a person does it, and added to the release that was just created.
  windows-games:
    name: Windows zip of ${{ matrix.game }}
    needs: github-release
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        game: [doodle_jump, treasure_run, coin_dash, game_2048, chess, tower_defense]
    steps:
      - uses: actions/checkout@v7
      - name: Export
        shell: cmd
        run: scripts\export.cmd games\${{ matrix.game }}\game.json --out dist
      - name: Add the zip to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  # The same games as Android packages, made with the NDK and Gradle of the runner. They are
  # signed with a debug key: a phone installs them by copying the file (adb install).
  android-games:
    name: Android APK of ${{ matrix.game }}
    needs: github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        game: [doodle_jump, treasure_run, coin_dash, game_2048, chess, tower_defense]
    steps:
      - uses: actions/checkout@v7
      - name: Export
        run: |
          cmake --preset release -DGE_BUILD_TESTS=OFF
          cmake --build --preset release --target gectl
          ./build/release/tools/gectl export games/${{ matrix.game }}/game.json --target android \
            --abi arm64-v8a,x86_64 --out dist
      - name: Add the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
