plugins {
    id 'com.android.application'
}

// The workflow passes the newest platform that is installed.
def sdkLevel = (project.findProperty('compileSdk') ?: '35') as int

android {
    namespace = "ge.spike"
    compileSdk sdkLevel
    defaultConfig {
        applicationId "ge.spike"
        minSdk 21
        targetSdk sdkLevel
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // build.sh puts libmain.so (and libSDL3.so) here, one folder per ABI.
    sourceSets.main.jniLibs.srcDir 'src/main/jniLibs'
    lint {
        abortOnError = false
    }
}
